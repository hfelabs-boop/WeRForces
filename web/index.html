<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WeRForces</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header id="toolbar">
      <div class="brand">WeRForces</div>
      <div class="menu" data-controller-only>
        <button id="btn-file">File ▾</button>
        <div class="menu-items" id="menu-file">
          <button data-action="new">New scenario</button>
          <button data-action="open-sample">Open scenario…</button>
          <button data-action="import">Import from file…</button>
          <button data-action="export">Export to file</button>
          <button data-action="save-server">Save on server…</button>
          <button data-action="review-recording">Review saved recording…</button>
          <button data-action="settings">Simulation settings…</button>
        </div>
      </div>
      <span id="scenario-name" class="scenario-name">—</span>
      <div class="sep"></div>
      <div class="sim-controls" data-controller-only>
        <button id="btn-rewind" title="Rewind to the last loaded or saved state">⏮</button>
        <button id="btn-run" class="primary" title="Run / pause (Space)">▶ Run</button>
        <button id="btn-step" title="Step 1 s">⏭</button>
        <select id="sel-speed" title="Time multiplier">
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
          <option value="8">8×</option>
          <option value="16">16×</option>
          <option value="32">32×</option>
        </select>
        <span id="sim-time" class="sim-time">00:00:00</span>
        <button id="env-chip" class="env-chip" title="Local time and weather: click to change">12:00</button>
      </div>
      <div class="sep"></div>
      <div class="tools" id="draw-tools">
        <button data-draw="route" title="Draw route">Route</button>
        <button data-draw="area" title="Draw area">Area</button>
        <button data-draw="phaseLine" title="Draw phase line">Phase line</button>
        <button data-draw="point" title="Place point">Point</button>
        <button data-draw="minefield" title="Draw minefield">Minefield</button>
        <button data-draw="obstacle" title="Draw obstacle line (ditch, wire)">Obstacle</button>
      </div>
      <div class="sep"></div>
      <div class="menu" id="layers-menu">
        <button id="btn-layers">Layers ▾</button>
        <div class="menu-items layers">
          <label><input type="checkbox" data-layer="labels" checked /> Labels</label>
          <label><input type="checkbox" data-layer="grid" checked /> Grid</label>
          <label><input type="checkbox" data-layer="contacts" checked /> Sensor contacts</label>
          <label><input type="checkbox" data-layer="ranges" /> Weapon/sensor ranges</label>
          <label><input type="checkbox" data-layer="paths" checked /> Planned paths</label>
          <select id="sel-aggregate" title="Unit display">
            <option value="auto">Units: auto</option>
            <option value="units">Units: aggregate</option>
            <option value="entities">Units: entities</option>
          </select>
        </div>
      </div>
      <div class="sep"></div>
      <div class="seg" id="view-seg" title="Map view">
        <button data-view="2d" class="active">2D</button>
        <button data-view="3d">3D</button>
        <button data-view="split">Split</button>
      </div>
      <button id="btn-aar" data-controller-only title="Replay the recording: after-action review">AAR</button>
      <button id="btn-integrations" data-controller-only title="API, MCP, TAK, webhooks and GIS export">Integrations</button>
      <a id="btn-help" class="button-link" href="/docs/" target="_blank" title="Documentation and tutorials">?</a>
      <div class="spacer"></div>
      <span id="dis-status" class="pill">DIS off</span>
      <span id="role-status" class="pill hidden"></span>
      <span id="conn-status" class="pill bad">offline</span>
    </header>

    <main>
      <aside id="left">
        <nav class="tabs">
          <button data-tab="create" class="active" data-controller-only>Create</button>
          <button data-tab="objects">Objects</button>
        </nav>
        <section id="tab-create" class="tab active">
          <div class="force-select">
            <label>Force</label>
            <div class="seg" id="force-seg">
              <button data-force="1" class="active blue">Blue</button>
              <button data-force="2" class="red">Red</button>
              <button data-force="3" class="neutral">Neutral</button>
            </div>
          </div>
          <input id="palette-filter" type="search" placeholder="Filter…" />
          <div id="palette"></div>
        </section>
        <section id="tab-objects" class="tab">
          <input id="objects-filter" type="search" placeholder="Filter…" />
          <div id="objects"></div>
        </section>
      </aside>

      <div id="map-wrap" class="view-2d">
        <div id="map-pane"><div id="map"></div><div id="cursor-readout"></div></div>
        <div id="view3d"></div>
      </div>

      <aside id="right">
        <div id="inspector"><p class="hint">Select an entity, unit or graphic on the map.</p></div>
      </aside>
    </main>

    <footer id="log-wrap">
      <div class="log-head">
        <strong>Event log</strong>
        <label><input type="checkbox" data-log="fire" /> fire</label>
        <label><input type="checkbox" data-log="detonation" checked /> detonations</label>
        <label><input type="checkbox" data-log="destroyed" checked /> kills</label>
        <label><input type="checkbox" data-log="damaged" checked /> damage</label>
        <label><input type="checkbox" data-log="detected" checked /> detections</label>
        <label><input type="checkbox" data-log="task" checked /> tasks</label>
        <label><input type="checkbox" data-log="info" checked /> info</label>
        <label><input type="checkbox" data-log="radio" /> radio</label>
        <label><input type="checkbox" data-log="created" /> created/deleted</label>
        <span class="spacer"></span>
        <span id="score"></span>
      </div>
      <div id="log"></div>
    </footer>

    <div id="context-menu" class="context-menu hidden"></div>
    <div id="modal" class="modal hidden"><div class="modal-body" id="modal-body"></div></div>
    <div id="toast" class="toast hidden"></div>
    <input type="file" id="file-input" accept=".json,application/json" hidden />
    <script type="module" src="app.js"></script>
  </body>
</html>
